server.port=8080

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/skill_drill
spring.datasource.username=postgres
spring.datasource.password=#Deep321

# Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configurations
security.jwt.secret=${JWT-SECRET}
security.jwt.access-ttl-seconds=${JWT-ACCESS-TTL-SECONDS:3600}
#security.jwt.refresh-ttl-seconds=${JWT-REFRESH-TTL-SECONDS:604800}
security.jwt.issuer=${JWT-ISSUER:skill-drill}

# OAtuh 2.0 configurations
google.client.id=${GOOGLE_CLIENT_ID}


# Send email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SENDER_MAIL}
spring.mail.password=${SENDER_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#logging.level.org.springframework.mail=DEBUG

#Files upload
# AI Configurations
spring.ai.chat.client.enabled=false

spring.ai.google.genai.api-key=${api_key}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.8

spring.ai.openai.api-key=${groq_key}
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.temperature=0.8
spring.ai.openai.chat.timeout=20s